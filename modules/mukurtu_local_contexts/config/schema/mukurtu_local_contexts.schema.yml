mukurtu_local_contexts.settings:
  type: config_object
  label: 'Mukurtu Local Contexts Settings'
  mapping:
    site_api_key:
      type: string
      label: 'Site API Key'
    site_projects_directory_description:
      type: mapping
      label: 'Site Projects Directory Description'
      mapping:
        value:
          type: label
          label: Description
        format:
          type: string
          label: Format
    hub_refresh_interval:
      type: integer
      label: 'Hub Refresh Interval'
    hub_endpoint:
      type: string
      label: 'Hub Endpoint'
    deleted_project_grace_period:
      type: integer
      label: 'Deleted Project Grace Period (seconds)'
    deleted_project_min_consecutive_failures:
      type: integer
      label: 'Deleted Project Minimum Consecutive Not-Found Syncs'

field.value.local_contexts_project:
  type: mapping
  label: Default value
  mapping:
    value:
      type: label
      label: Value

field.storage_settings.local_contexts_project:
  type: field.storage_settings.string

field.storage_settings.local_contexts_label_and_notice:
  type: field.storage_settings.string
