mukurtu_media.settings:
  type: config_object
  label: 'Mukurtu Media settings'
  mapping:
    mukurtu_media_download_enabled:
      type: boolean
      label: 'Enable media download button'
    youtube_api_key:
      type: string
      label: 'YouTube Data API key (Key module key ID)'
    restricted_media_placeholder:
      type: sequence
      label: 'Restricted media placeholder image.'
      sequence:
        type: string
        label: 'File fid.'
    no_media_placeholder:
      type: sequence
      label: 'No media placeholder image.'
      sequence:
        type: string
        label: 'File fid.'

mukurtu_thumbnail.settings:
  type: config_object
  label: 'Mukurtu Thumbnail Settings'
  mapping:
    audio_default_thumbnail:
      type: sequence
      label: 'Audio default thumbnail'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    video_default_thumbnail:
      type: sequence
      label: 'Video default thumbnail'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    document:
      type: sequence
      label: 'Document default thumbnail'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    image:
      type: sequence
      label: 'Image default thumbnail'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    external_embed:
      type: sequence
      label: 'External embed default thumbnail'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    remote_video:
      type: sequence
      label: 'Remote video default thumbnail'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    soundcloud:
      type: sequence
      label: 'SoundCloud default thumbnail'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    # Older sites stored audio and video under the bare bundle name, and
    # AudioHelper still reads the audio one.
    audio:
      type: sequence
      label: 'Audio default thumbnail (legacy key)'
      sequence:
        type: integer
        label: 'Thumbnail file ID'
    video:
      type: sequence
      label: 'Video default thumbnail (legacy key)'
      sequence:
        type: integer
        label: 'Thumbnail file ID'

field.storage_settings.mukurtu_video_track:
  type: field.storage_settings.file
  label: 'Video caption track storage settings'

field.field_settings.mukurtu_video_track:
  type: field.field_settings.file
  label: 'Video caption track settings'

field.value.mukurtu_video_track:
  type: field.value.file
  label: 'Default value'

field.widget.settings.mukurtu_video_track:
  type: field.widget.settings.file_generic
  label: 'Video caption track widget settings'

field.formatter.settings.mukurtu_video_with_tracks:
  type: field.formatter.settings.file_video
  label: 'Video with caption tracks display format settings'
