services:
  plugin.manager.mukurtu_import_field_process:
    class: Drupal\mukurtu_import\MukurtuImportFieldProcessPluginManager
    parent: default_plugin_manager
  mukurtu_import.log_storage:
    class: Drupal\mukurtu_import\MukurtuImportLogStorage
    arguments: ['@database']
  mukurtu_import.spreadsheet_converter:
    class: Drupal\mukurtu_import\SpreadsheetConverter
    arguments: ['@entity_type.manager', '@file_system']
