# Entity reference with role. Each extends the matching entity_reference
# schema, since the field type, widget and formatter extend core's.
field.storage_settings.mukurtu_entity_reference_role:
  type: field.storage_settings.entity_reference

field.field_settings.mukurtu_entity_reference_role:
  type: field.field_settings.entity_reference
  mapping:
    role_target_bundles:
      type: sequence
      label: 'Role vocabularies'
      sequence:
        type: string
        label: 'Vocabulary'

field.value.mukurtu_entity_reference_role:
  type: field.value.entity_reference
  mapping:
    role_target_id:
      type: integer
      label: 'Role term ID'

field.widget.settings.mukurtu_entity_reference_role_autocomplete:
  type: field.widget.settings.entity_reference_autocomplete

field.formatter.settings.mukurtu_entity_reference_role_label:
  type: field.formatter.settings.entity_reference_label

field.widget.settings.mukurtu_entity_reference_role_tagify:
  type: field.widget.settings.tagify_entity_reference_autocomplete_widget

# flat_taxonomy ships this schema at its module root rather than in
# config/schema/, so Drupal never discovers it, and every shipped Mukurtu
# vocabulary's third-party setting fails strict schema checks. Same shape as
# flat_taxonomy.schema.yml; harmless if that module ever moves its file.
taxonomy.vocabulary.*.third_party.flat_taxonomy:
  type: mapping
  label: 'Flat'
  mapping:
    flat:
      type: integer
      label: 'Flat'

mukurtu_core.person_roles:
  type: config_object
  label: 'Person role settings'
  mapping:
    enabled_fields:
      type: sequence
      label: 'Person fields that record a role for each name'
      sequence:
        type: string
        label: 'Field name'

mukurtu_core.visitors_map:
  type: config_object
  label: 'Visitor map settings'
  mapping:
    city_threshold:
      type: integer
      label: 'Minimum unique visitors for a city to appear on the visitor map on its own'

views.filter.mukurtu_node_community_filter:
  type: views.filter.in_operator
  label: 'Node community filter'

views.filter.mukurtu_node_protocol_filter:
  type: views.filter.in_operator
  label: 'Node cultural protocol filter'

views.filter.mukurtu_node_in_collection:
  type: views.filter.in_operator
  label: 'Node in collection filter'

views.filter.mukurtu_node_in_word_list:
  type: views.filter.in_operator
  label: 'Node in word list filter'

views.filter.mukurtu_media_community_filter:
  type: views.filter.in_operator
  label: 'Media community filter'

views.filter.mukurtu_media_protocol_filter:
  type: views.filter.in_operator
  label: 'Media cultural protocol filter'

views.filter.mukurtu_media_tag_filter:
  type: views.filter.in_operator
  label: 'Media tag filter'

views_bulk_operations.action_config.mukurtu_change_moderation_state_action:
  type: views_bulk_operations_action_config
  label: 'Change moderation state action preconfiguration'
  mapping:
    target_state:
      type: string
      label: 'Target state'

plugin.plugin_configuration.search_api_backend.mukurtu_db:
  type: plugin.plugin_configuration.search_api_backend.search_api_db
  label: 'Mukurtu database backend settings'

# consent_popup ships no schema. ConfigSchemaHooks adds one
# mukurtu_core.consent_popup_text key per configurable language.
block.settings.consent_popup:
  type: block_settings
  label: 'Consent popup block settings'
  mapping:
    non_blocking:
      type: integer
      label: 'Non-blocking'
    redirect:
      type: integer
      label: 'Redirect on decline'
    cookie:
      type: mapping
      label: 'Cookie'
      mapping:
        cookie_name:
          type: string
          label: 'Cookie name'
        cookie_life:
          type: string
          label: 'Cookie lifetime in days'
    design:
      type: mapping
      label: 'Design'
      mapping:
        color:
          type: color_hex
          label: 'Background color'
        color_opacity:
          type: string
          label: 'Background opacity'
        blur:
          type: string
          label: 'Elements to blur'

mukurtu_core.consent_popup_text:
  type: mapping
  label: 'Consent popup text'
  mapping:
    text:
      type: string
      label: 'Popup text'
    text_decline:
      type: string
      label: 'Decline text'
    accept:
      type: string
      label: 'Accept button text'
    decline:
      type: string
      label: 'Decline button text'
    decline_link:
      type: mapping
      label: 'Decline link'
      mapping:
        decline_url:
          type: string
          label: 'Decline link URL'
        decline_url_text:
          type: string
          label: 'Decline link text'
