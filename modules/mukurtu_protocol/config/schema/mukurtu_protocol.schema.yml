entity_browser.browser.widget.mukurtu_user_selection:
  type: mapping
  label: 'View widget configuration'
  mapping:
    submit_text:
      type: label
      label: 'Submit button text'

entity_browser.browser.widget.mukurtu_taxonomy_record_term_selection:
  type: mapping
  label: 'View widget configuration'
  mapping:
    submit_text:
      type: label
      label: 'Submit button text'

mukurtu_protocol.comment_settings:
  type: config_object
  label: 'Mukurtu Comment Settings'
  mapping:
    site_comments_enabled:
      type: integer
    site_comments_require_approval:
      type: boolean
    anonymous_comments_require_email:
      type: boolean

mukurtu_protocol.community_organization:
  type: config_object
  label: 'Community Organization Settings'
  mapping:
    organization:
      type: sequence
      sequence:
        type: mapping
        mapping:
          parent:
            type: integer
            label: 'Parent ID'
          weight:
            type: integer
            label: 'Weight'

field.field_settings.cultural_protocol:
  type: mapping
  label: 'Cultural Protocol settings'
  mapping:
    target_id:
      type: integer
      label: 'Protocol Control ID'

views.access.mukurtu_permission:
  type: mapping
  label: 'Permission'
  mapping:
    site:
      type: sequence
      label: 'Site Permissions'
      sequence:
        type: string
        label: 'Permission'
    community:
      type: sequence
      label: 'Community Permissions'
      sequence:
        type: string
        label: 'Permission'
    protocol:
      type: sequence
      label: 'Protocol Permissions'
      sequence:
        type: string
        label: 'Permission'
    conjunction:
      type: string
      label: 'Conjunction'

views.access.site_and_mukurtu_role:
  type: mapping
  label: 'Permission'
  mapping:
    site-role:
      type: sequence
      label: 'Site Permissions'
      sequence:
        type: string
        label: 'Permission'
    community-role:
      type: sequence
      label: 'Community Permissions'
      sequence:
        type: string
        label: 'Permission'
    protocol-role:
      type: sequence
      label: 'Protocol Permissions'
      sequence:
        type: string
        label: 'Permission'

field.formatter.settings.mukurtu_comment_default:
  type: field.formatter.settings.comment_default
  label: 'Mukurtu comment display format settings'

views.filter.user_community_filter:
  type: views.filter.in_operator
  label: 'User community filter'

plugin.plugin_configuration.facets_processor.cultural_protocol_facet_label_processor:
