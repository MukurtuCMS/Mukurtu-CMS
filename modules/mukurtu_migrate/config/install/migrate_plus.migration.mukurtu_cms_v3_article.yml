langcode: en
status: true
dependencies:
  enforced:
    module:
      - mukurtu_migrate
id: mukurtu_cms_v3_article
class: null
idMap: {  }
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Mukurtu 3'
migration_group: mukurtu_cms_v3
label: Article
source:
  plugin: d7_node
  node_type: article
process:
  nid: nid
  uid:
    plugin: migration_lookup
    migration:
      - mukurtu_cms_v3_users
      - mukurtu_cms_v3_users_uid1
    source: uid
  langcode: language
  title: title
  body/value:
    -
      plugin: get
      source: body/0/value
    -
      plugin: media_embed
  body/format:
    plugin: default_value
    default_value: basic_html
  _article_category_tags:
    plugin: sub_process
    source: field_category
    process:
      target_id:
        -
          plugin: migration_lookup
          migration: mukurtu_cms_v3_terms_category
          source: tid
          no_stub: true
        -
          plugin: skip_on_empty
          method: process
        -
          plugin: entity_value
          entity_type: taxonomy_term
          field_name: name
        -
          plugin: extract
          index:
            - 0
            - value
        -
          plugin: entity_generate
          entity_type: taxonomy_term
          bundle_key: vid
          bundle: article_tags
          value_key: name
          ignore_case: true
  _article_keyword_tags:
    plugin: sub_process
    source: field_tags
    process:
      target_id:
        -
          plugin: migration_lookup
          migration: mukurtu_cms_v3_terms_keywords
          source: tid
          no_stub: true
        -
          plugin: skip_on_empty
          method: process
        -
          plugin: entity_value
          entity_type: taxonomy_term
          field_name: name
        -
          plugin: extract
          index:
            - 0
            - value
        -
          plugin: entity_generate
          entity_type: taxonomy_term
          bundle_key: vid
          bundle: article_tags
          value_key: name
          ignore_case: true
  field_article_tags:
    -
      plugin: merge
      source:
        - '@_article_category_tags'
        - '@_article_keyword_tags'
    -
      plugin: flatten
    -
      plugin: callback
      callable: array_unique
    -
      plugin: callback
      callable: array_values
  status: status
  created: created
  changed: changed
destination:
  plugin: 'entity:node'
  default_bundle: article
migration_dependencies:
  required:
    - mukurtu_cms_v3_users
    - mukurtu_cms_v3_users_uid1
    - mukurtu_cms_v3_terms_category
    - mukurtu_cms_v3_terms_keywords
    - mukurtu_cms_v3_file_private
    - mukurtu_cms_v3_file
  optional:
    - d7_field_instance
include: null
