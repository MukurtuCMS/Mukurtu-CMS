services:
  map_browse_nodes:
    class: Drupal\mukurtu_browse\ParamConverter\MukurtuMapNodesParamConverter
    arguments: ['@entity_type.manager']
    tags:
      - { name: paramconverter }

  mukurtu_browse.media_type_indexing_items_subscriber:
    class: Drupal\mukurtu_browse\EventSubscriber\MediaTypeIndexingItemsSubscriber
    tags:
      - { name: event_subscriber }

  mukurtu_browse.browse_link_builder:
    class: Drupal\mukurtu_browse\Service\BrowseLinkBuilder
    arguments: ['@config.factory', '@entity_type.manager']

  mukurtu_browse.header_suggestion_builder:
    class: Drupal\mukurtu_browse\Service\HeaderSuggestionBuilder
    arguments: ['@entity.repository', '@entity_type.bundle.info', '@mukurtu_browse.browse_link_builder']
