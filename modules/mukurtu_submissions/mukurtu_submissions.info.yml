name: 'Mukurtu Submissions'
type: module
description: 'Allows site visitors to submit content for review without community/protocol membership.'
package: 'Mukurtu CMS'
core_version_requirement: '^10 || ^11'
dependencies:
  - 'drupal:content_moderation'
  - 'drupal:field'
  - 'drupal:node'
  - 'drupal:path_alias'
  - 'drupal:user'
  - 'drupal:views'
  - 'message:message'
  - 'message_notify:message_notify'
  - 'message_subscribe:message_subscribe'
  - 'mukurtu_core:mukurtu_core'
  - 'mukurtu_notifications:mukurtu_notifications'
  - 'mukurtu_protocol:mukurtu_protocol'
version: 4.x-dev
