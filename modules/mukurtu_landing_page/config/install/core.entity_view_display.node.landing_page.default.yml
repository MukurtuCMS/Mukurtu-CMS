      - Help
      - 'Inline blocks'
      - 'Lists (Views)'
      - Menus
      - 'Organic Groups'
      - Subscriptions
      - System
      - User
      - Views
      - core
    entity_view_mode_restriction:
      allowed_layouts:
        - layout_onecol
      denylisted_blocks: {  }
      allowlisted_blocks:
        'Inline blocks':
          - 'inline_block:basic'
          - 'inline_block:call_to_action'
          - 'inline_block:featured_content'
          - 'inline_block:horizontal_divider'
          - 'inline_block:local_contexts_block'
          - 'inline_block:media_carousel_block'
        'Lists (Views)':
          - 'views_block:browse_by_community-community_browse_block'
          - 'views_block:mukurtu_browse_by_map-map_block'
          - 'views_block:mukurtu_categories-browse_by_category_block'
      restricted_categories:
        - 'Chaos Tools'
        - 'Config Pages'
        - 'Content fields'
        - Custom
        - Devel
        - Facets
        - Forms
        - Help
        - Menus
        - 'Organic Groups'
        - Subscriptions
        - System
        - User
        - Views
        - core
