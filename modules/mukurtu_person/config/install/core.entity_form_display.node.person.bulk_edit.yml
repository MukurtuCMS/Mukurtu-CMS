langcode: en
status: true
dependencies:
  config:
    - core.entity_form_mode.node.bulk_edit
    - entity_browser.browser.mukurtu_content_browser
    - field.field.node.person.comment
    - field.field.node.person.field_coverage
    - node.type.person
  module:
    - entity_browser
    - media_library
    - mukurtu_core
    - mukurtu_local_contexts
    - original_date
    - tagify
    - text
id: node.person.bulk_edit
targetEntityType: node
bundle: person
mode: bulk_edit
content:
  field_coverage:
    type: geofield_mukurtu
    weight: 10
    region: content
    settings:
      geometry_validation: false
      map:
        leaflet_map: 'OSM Mapnik'
        height: 400
        auto_center: 1
        map_position:
          force: false
          center:
            lat: 20.0
            lon: 10.0
          zoomControlPosition: topleft
          zoom: 2
          minZoom: 1
          maxZoom: 18
          zoomFiner: 0
          singlePointZoom: 12
        scroll_zoom_enabled: 1
      input:
        show: false
        readonly: false
      toolbar:
        position: topright
        marker: defaultMarker
        drawPolyline: true
        drawRectangle: true
        drawPolygon: true
        drawCircle: true
        drawText: false
        editMode: true
        dragMode: true
        cutPolygon: false
        removalMode: true
        rotateMode: false
      reset_map:
        control: false
        options: '{"position":"topleft","title":"Reset View"}'
      map_scale:
        control: false
        options: '{"position":"bottomright","maxWidth":100,"metric":true,"imperial":false,"updateWhenIdle":false}'
      fullscreen:
        control: false
        options: '{"position":"topleft","pseudoFullscreen":false}'
      path: '{"color":"#3388ff","opacity":"1.0","stroke":true,"weight":3,"fill":"depends","fillColor":"*","fillOpacity":"0.2","radius":"6"}'
      feature_properties:
        values: ''
      locate:
        control: true
        options: '{"position":"topright","setView":"untilPanOrZoom","returnToPrevBounds":true,"strings":{"title":"Locate my position"}}'
        automatic: true
      geocoder:
        control: true
        settings:
          popup: false
          position: topright
          input_size: 20
          providers:
            nominatim:
              weight: 0
              checked: true
          min_terms: 4
          delay: 800
          zoom: 16
          options: ''
    third_party_settings: {  }
  field_coverage_description:
    type: text_textarea
    weight: 11
    region: content
    settings:
      rows: 5
      placeholder: ''
    third_party_settings: {  }
  field_date_born:
    type: original_date_text
    weight: 7
    region: content
    settings: {  }
    third_party_settings: {  }
  field_date_died:
    type: original_date_text
    weight: 8
    region: content
    settings: {  }
    third_party_settings: {  }
  field_deceased:
    type: boolean_checkbox
    weight: 9
    region: content
    settings:
      display_label: true
    third_party_settings: {  }
  field_keywords:
    type: tagify_entity_reference_autocomplete_widget
    weight: 9
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 0
      placeholder: ''
      suggestions_dropdown: 0
      show_entity_id: 0
      show_info_label: 0
      info_label: ''
      parent_selection: 1
    third_party_settings: {  }
  field_local_contexts_labels_and_notices:
    type: local_contexts_label_and_notice
    weight: 26
    region: content
    settings: {  }
    third_party_settings: {  }
  field_local_contexts_projects:
    type: local_contexts_project
    weight: 25
    region: content
    settings: {  }
    third_party_settings: {  }
  field_location:
    type: tagify_entity_reference_autocomplete_widget
    weight: 12
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 0
      placeholder: ''
      suggestions_dropdown: 0
      show_entity_id: 0
      show_info_label: 0
      info_label: ''
      parent_selection: 1
    third_party_settings: {  }
  field_media_assets:
    type: media_library_widget
    weight: 6
    region: content
    settings:
      media_types:
        - audio
        - document
        - external_embed
        - image
        - remote_video
        - soundcloud
        - video
    third_party_settings: {  }
  field_other_names:
    type: tagify_entity_reference_autocomplete_widget
    weight: 5
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 0
      placeholder: ''
      suggestions_dropdown: 0
      show_entity_id: 0
      show_info_label: 1
      info_label: '[term:vocabulary]'
      parent_selection: 1
    third_party_settings: {  }
  field_place_of_birth:
    type: tagify_entity_reference_autocomplete_widget
    weight: 12
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 0
      placeholder: ''
      suggestions_dropdown: 0
      show_entity_id: 0
      show_info_label: 0
      info_label: ''
      parent_selection: 1
    third_party_settings: {  }
  field_place_of_death:
    type: tagify_entity_reference_autocomplete_widget
    weight: 12
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 0
      placeholder: ''
      suggestions_dropdown: 0
      show_entity_id: 0
      show_info_label: 0
      info_label: ''
      parent_selection: 1
    third_party_settings: {  }
  field_related_content:
    type: entity_browser_entity_reference
    weight: 6
    region: content
    settings:
      entity_browser: mukurtu_content_browser
      field_widget_display: rendered_entity
      field_widget_edit: false
      field_widget_remove: true
      field_widget_replace: false
      open: true
      field_widget_display_settings:
        view_mode: form_selection
      selection_mode: selection_append
    third_party_settings: {  }
hidden:
  comment: true
  created: true
  field_content_type: true
  field_cultural_protocols: true
  field_protocol_control: true
  field_related_people: true
  field_sections: true
  field_sequence_collection: true
  langcode: true
  moderation_state: true
  path: true
  promote: true
  status: true
  sticky: true
  title: true
  uid: true
  url_redirects: true
