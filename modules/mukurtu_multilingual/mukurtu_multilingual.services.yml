services:
  mukurtu_multilingual.fallback_alias_repository:
    class: Drupal\mukurtu_multilingual\PathAlias\FallbackAliasRepository
    decorates: path_alias.repository
    decoration_on_invalid: ignore
    arguments: ['@.inner', '@language_manager']
  mukurtu_multilingual.translation_status_tracker:
    class: Drupal\mukurtu_multilingual\TranslationStatus\TranslationStatusTracker
    arguments: ['@database', '@entity_type.manager', '@language_manager', '@content_translation.manager', '@queue', '@entity_type.bundle.info', '@state']
  Drupal\mukurtu_multilingual\TranslationStatus\TranslationStatusTracker: '@mukurtu_multilingual.translation_status_tracker'
