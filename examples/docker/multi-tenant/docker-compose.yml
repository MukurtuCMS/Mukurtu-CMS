# Several independent Mukurtu sites on one host, each at its own domain. NOT Drupal's
# "multisite": every site is its own container with its own configuration, database and
# files. A Caddy proxy owns ports 80 and 443, routes each domain to its site by the Host
# header, and gets the HTTPS certificates; the sites publish nothing on the host.
# How to run it: README.md. Settings: docs/docker.md ("Hosting many sites").
#
# To add a site:
#   1. Copy the site_b block and its two volumes; give it a new name and settings.
#   2. Add its database and user to the db_init config below (that script only runs on the
#      database's first start; for an existing database, create them by hand).
#   3. Add three lines for its domain to the caddyfile config below.
#   4. Add its variables to .env, and run: docker compose up -d
#
# The passwords are plain environment variables here to keep the example short. For
# production prefer the *_FILE secret form shown in ../single-site: environment variables
# are visible to anyone who can run `docker inspect`.

name: mukurtu-hosting

x-mukurtu: &mukurtu
  # Required, with no default: pin an exact version and upgrade on purpose.
  image: ${MUKURTU_IMAGE:?set MUKURTU_IMAGE in .env}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # Per-site ceiling, with headroom for ffmpeg and poppler (see docs/docker.md).
  mem_limit: 1g
  depends_on:
    db:
      condition: service_healthy
  networks: [proxy, backend]

x-mukurtu-env: &mukurtu-env
  MUKURTU_DB_HOST: db
  # Trust X-Forwarded-* only from the proxy network defined below.
  MUKURTU_REVERSE_PROXY: "true"
  MUKURTU_REVERSE_PROXY_ADDRESSES: 172.28.0.0/24
  # Idle sites should cost almost nothing: PHP workers exist only while a
  # request is being served (the default), and are capped.
  MUKURTU_FPM_MAX_CHILDREN: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # Certificates and Caddy's account with Let's Encrypt. Keep this volume, or
      # certificates are re-issued (and rate limits apply).
      - caddy_data:/data
      - caddy_config:/config
    # Not read_only, unlike the Mukurtu sites: Compose cannot place an inline config
    # (the Caddyfile below) in a read-only service. Caddy still has no extra
    # capabilities, only the right to bind ports 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks: [proxy]

  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --transaction-isolation=READ-COMMITTED
      - --binlog-format=ROW
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=384M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    configs:
      # One database and one user per site, created on the database's first start.
      - source: db_init
        target: /docker-entrypoint-initdb.d/10-sites.sql
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    networks: [backend]

  site_a:
    <<: *mukurtu
    environment:
      <<: *mukurtu-env
      MUKURTU_DB_NAME: site_a
      MUKURTU_DB_USER: site_a
      MUKURTU_DB_PASSWORD: ${SITE_A_DB_PASSWORD:?set SITE_A_DB_PASSWORD in .env}
      MUKURTU_TRUSTED_HOSTS: ${SITE_A_HOST:?set SITE_A_HOST in .env}
      MUKURTU_ADMIN_PASSWORD: ${SITE_A_ADMIN_PASSWORD:?set SITE_A_ADMIN_PASSWORD in .env}
      MUKURTU_ADMIN_EMAIL: ${SITE_A_ADMIN_EMAIL:?set SITE_A_ADMIN_EMAIL in .env}
      MUKURTU_SITE_NAME: Site A
    volumes:
      - site_a_public:/var/www/files/public
      - site_a_private:/var/www/files/private
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=16m,mode=1777

  site_b:
    <<: *mukurtu
    environment:
      <<: *mukurtu-env
      MUKURTU_DB_NAME: site_b
      MUKURTU_DB_USER: site_b
      MUKURTU_DB_PASSWORD: ${SITE_B_DB_PASSWORD:?set SITE_B_DB_PASSWORD in .env}
      MUKURTU_TRUSTED_HOSTS: ${SITE_B_HOST:?set SITE_B_HOST in .env}
      MUKURTU_ADMIN_PASSWORD: ${SITE_B_ADMIN_PASSWORD:?set SITE_B_ADMIN_PASSWORD in .env}
      MUKURTU_ADMIN_EMAIL: ${SITE_B_ADMIN_EMAIL:?set SITE_B_ADMIN_EMAIL in .env}
      MUKURTU_SITE_NAME: Site B
    volumes:
      - site_b_public:/var/www/files/public
      - site_b_private:/var/www/files/private
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /run:size=16m,mode=1777

configs:
  # Which domain goes to which site. Caddy sets X-Forwarded-For, -Proto and -Host on
  # the requests it passes on, which is what MUKURTU_REVERSE_PROXY relies on. Domains
  # that are not listed here get no certificate and are not served.
  caddyfile:
    content: |
      {
        email ${ACME_EMAIL:?set ACME_EMAIL in .env}
      }

      ${SITE_A_HOST} {
        reverse_proxy site_a:8080
      }

      ${SITE_B_HOST} {
        reverse_proxy site_b:8080
      }

  db_init:
    content: |
      CREATE DATABASE site_a CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
      CREATE USER 'site_a'@'%' IDENTIFIED BY '${SITE_A_DB_PASSWORD}';
      GRANT ALL PRIVILEGES ON site_a.* TO 'site_a'@'%';
      CREATE DATABASE site_b CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
      CREATE USER 'site_b'@'%' IDENTIFIED BY '${SITE_B_DB_PASSWORD}';
      GRANT ALL PRIVILEGES ON site_b.* TO 'site_b'@'%';

volumes:
  caddy_data:
  caddy_config:
  db:
  site_a_public:
  site_a_private:
  site_b_public:
  site_b_private:

networks:
  # The proxy network has a fixed range so MUKURTU_REVERSE_PROXY_ADDRESSES can
  # name it.
  proxy:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # The database is reachable only from the sites, never from the proxy network.
  backend:
    internal: true
