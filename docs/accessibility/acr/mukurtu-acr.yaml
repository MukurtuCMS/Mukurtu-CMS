title: Mukurtu CMS Accessibility Conformance Report
product:
  name: Mukurtu CMS
  version: "4"
  description: >-
    Mukurtu CMS is a free, mobile, and open source platform built with
    Indigenous communities to manage and share digital cultural heritage.
    It is a distribution of the Drupal content management system.
author:
  name: "Mukurtu CMS Development Team"
  company_name: "Center for Digital Scholarship and Curation, Washington State University"
  address: ""
  email: "support@mukurtu.org"
  phone: ""
  website: "https://mukurtu.org"
report_date: "2026-07-10"
last_modified_date: "2026-10-09"
version: 3
notes: >-
  This is a living document maintained as part of the Mukurtu CMS
  accessibility program (see docs/accessibility/README.md in the Mukurtu CMS
  repository). All criteria begin as not-evaluated and are updated as audit
  findings are triaged. Assessments reflect Mukurtu CMS itself (its
  installation profile, custom modules, and the mukurtu_v4 theme); conformance
  of an individual Mukurtu site also depends on its content and configuration.
evaluation_methods_used: >-
  Automated scanning with axe-core (via Playwright) across a representative
  page inventory, combined with manual keyboard-only testing and screen reader
  testing (NVDA, VoiceOver, or Orca) following the program's manual testing
  checklist. Findings are consolidated by WCAG Success Criterion before
  conformance levels are assigned.
legal_disclaimer: >-
  The information herein is provided in good faith based on the analysis of
  the product at the time of the review and does not represent a
  legally-binding claim. Please contact us to report any accessibility errors
  or conformance claim errors for re-evaluation and correction, if necessary.
repository: "https://github.com/MukurtuCMS/Mukurtu-CMS"
feedback: "https://github.com/MukurtuCMS/Mukurtu-CMS/issues"
license: GPL-2.0-or-later
related_openacrs:
  - url: "https://github.com/GSA/openacr/blob/main/openacr/drupal-9.yaml"
    type: secondary
chapters:
  success_criteria_level_a:
    notes: >-
      Mukurtu CMS is a Drupal distribution. The "Web" component below covers
      the visitor and logged-in member experience (the current audit scope).
      The "Authoring Tool" component covers the content creation and
      administration experience, which will be evaluated in a later phase
      against ATAG 2.0 in addition to WCAG.
    criteria:
      - num: 1.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated checks (axe-core, July 2026) across the audited page
                inventory found no missing text alternatives. Map location
                markers previously exposed as unnamed buttons were fixed to
                carry the name of the item whose location they show. Alt text
                quality on real site content is author-dependent and is
                reviewed in the manual audit cycle.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.2.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Capability check. Digital heritage items carry
                field_transcription, described as a basic text
                transcription of an audio or video recording,
                and it is rendered on the full and
                taxonomy_record displays, so an author can
                provide a text alternative and a visitor can
                read it. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.2.2
        components:
          - name: web
            adherence:
              level: partially-supports
              notes: >-
                Locally hosted video cannot carry captions.
                The video media type offers an author no
                caption or subtitle track field, and the
                file_video formatter renders no track element,
                so a site that uploads its own video has no
                way to provide synchronised captions (issue
                #2329). The remote_video type is unaffected,
                because the provider carries its own captions.
                A transcript is not a substitute: it satisfies
                1.2.3, which accepts a media alternative, but
                not 1.2.2, which requires synchronisation. The
                same evidence bears on the authoring-tool
                component, which is evaluated separately.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.2.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                The digital heritage transcription field is a
                media alternative, which 1.2.3 accepts in
                place of audio description. Caveat: the field
                is described to authors as a basic
                transcription, so whether any given item's
                text is a full alternative is editorial rather
                than structural. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated structural checks (axe-core, July 2026) pass
                across the audited page inventory. The page title region
                was moved inside the main landmark so all page content
                is contained by landmarks (fixed July 2026). Landing
                pages previously derived their heading level from
                whether the page was the front page, so a page could
                emit several first-level headings or none at all
                depending on which blocks an author placed; heading
                levels are now fixed and the front page carries exactly
                one visually-hidden first-level heading regardless of
                block placement (September 2026, issue #2176, PR #2207).
                Heading outline quality and reading order are verified
                in the manual audit cycle. Evidence for the September
                2026 changes is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.2
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No UI string gives an instruction by position,
                shape, size or colour alone, checked across
                the product's module and theme strings.
                Instructions as rendered, rather than as
                authored, are confirmed in the visual pass.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.1
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Nothing autoplays. The dictionary audio
                display sets autoplay false, the lightbox sets
                autoplayVideos false, and the YouTube oEmbed
                lists autoplay in its allow attribute, which
                is a permission rather than an instruction,
                with no autoplay parameter in the URL.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.1.1
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.1.2
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.1.4
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Every file binding keydown or keypress uses
                non-printable keys, except Enter and Space in
                two places, both scoped to a focused element.
                The active-only-on-focus exception applies,
                and activating a control with Enter or Space
                is standard operation rather than a shortcut.
                Enforced in CI by the character-key-shortcuts
                lint, which fails the build on a
                single-character handler bound to document,
                window or body, and self-tests its matcher
                before trusting it. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.2.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No time limits. No meta refresh, no
                location.reload and no setInterval in the
                product's JavaScript, and no session lifetime
                override is shipped. Drupal's session expiry
                is a security timeout, which 2.2.1 exempts.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.2.2
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.3.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No keyframe animation in any of the product's
                own stylesheets. The only animation present is
                a vendor carousel's rotating loading spinner,
                which does not flash. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                A skip-to-main-content link is provided on every page, and as
                of July 2026 the page heading sits inside the skip link's
                target landmark. Automated checks pass; keyboard verification
                of the skip link across page types is part of the manual
                audit cycle.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated checks (axe-core, July 2026) confirm every audited
                page has a page title. Title descriptiveness is reviewed with
                headings and labels (2.4.6) in the manual audit cycle.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.3
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.4
