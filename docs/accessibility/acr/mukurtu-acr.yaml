              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.3.2
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 4.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Satisfied by definition in HTML5, and removed
                from WCAG in 2.2. Recorded with its reasoning
                rather than tested. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 4.1.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated ARIA checks (axe-core, July 2026) pass across the
                audited page inventory, including protocol-gated member
                views. Map location markers previously rendered as focusable
                buttons with no accessible name were fixed (July 2026).
                Keyboard and screen reader verification of custom widgets
                (carousel, tabs, audio player, autocomplete) is part of the
                manual audit cycle.
          - name: authoring-tool
            adherence:
              level: partially-supports
              notes: >-
                July 2026 scans of pages rendered with the administration
                toolbar found 15 toolbar buttons and links with no accessible
                name, and an invalid ARIA attribute on three toolbar menus.
                Both originate upstream in the Gin admin theme and affect
                authenticated administrators and authors only. Both are now
                resolved (September 2026, issue #2003, PR #2225): the
                collapsed toolbar hid its labels with display:none, removing
                them from the accessibility tree, and now uses a
                visually-hidden technique instead; the invalid attribute is
                corrected by carrying Gin's own reviewed fix as a composer
                patch until it is released upstream. A re-scan of
                /admin/content with the toolbar collapsed reports no
                remaining violations of these rules. Evidence for the
                September 2026 changes is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
                The full authoring interface has still not been evaluated,
                so this remains a partial claim pending a Phase 2 audit of
                the authoring surface. Issue #1975 scoped and closed out
                that phase's inventory and its form-by-form code read; the
                evaluation itself does not yet have its own tracking issue.
  success_criteria_level_aa:
    notes: ""
    criteria:
      - num: 1.2.4
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: >-
                No live-streaming or real-time media
                capability exists in the product, so there is
                no live content to caption. Recorded as
                not-applicable rather than supports, which are
                different claims. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.2.5
        components:
          - name: web
            adherence:
              level: does-not-support
              notes: >-
                No synchronised audio description capability
                for locally hosted video: the video media type
                has no described-track field and the player
                renders no track element (issue #2355). A
                transcript does not satisfy 1.2.5, which
                requires description synchronised with the
                video. The remote_video type depends on the
                provider. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.4
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No orientation lock. The theme's breakpoint
                map defines portrait and landscape aliases,
                but nothing uses them to restrict display to a
                single orientation. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.5
        components:
          - name: web
            adherence:
              level: partially-supports
              notes: >-
                The login form identifies its purpose
                correctly: the username and password fields
                carry autocomplete username and
                current-password, and that is gated in CI by
                input-purpose.spec.ts, which asserts each
                field exists before asserting its token. The
                account form does not. Drupal core's
                AccountForm sets autocomplete off on the
                email, username and password fields whenever
                the form is not a registration, and on the
                current password field always, so on a page
                where a person edits their own account the
                purpose of those fields is not
                programmatically determinable. Core's stated
                reason is to stop a browser prefilling another
                person's details, which is a real concern on
                the administrative path but does not hold
                where someone is editing their own account.
                The inventory-wide checkInputPurpose reports
                these three fields on /user/*/edit and reports
                nothing elsewhere. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated contrast checks (axe-core, July 2026) pass
                across the audited page inventory. A failing admin
                accent color (4.48:1) reachable by members on
                /my-content was darkened to 5.3:1 (fixed July 2026). Two
                of the three cases automated tools cannot judge have
                since been measured and fixed (September 2026): hero
                text over author-uploaded photographs, where a
                light/dark toggle could not meet the criterion over an
                arbitrary image, now carries an opaque per-glyph stroke
                whose contrast against the fill is fixed independent of
                the photograph (5.00:1 and 8.39:1 for the two built-in
                palettes; issue #2175, PR #2207); and the horizontal
                image-with-description panel, which failed at 2.45:1 on
                the Blue and gold palette, now uses a per-palette token
                reaching 4.78:1 (issue #2178, same PR). Map controls
                remain queued for manual contrast measurement. Evidence
                for the September 2026 changes is recorded by criterion
                in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.4
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.5
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.10
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Raised back to supports in October 2026, on the evidence of
                a clean run rather than on the strength of the fixes alone.
                The criterion was downgraded earlier that month because the
                previous claim said automated reflow testing asserts no
                horizontal scrolling at 320px "across the page inventory",
                which conflated the gating spec with a report-only check,
                and because real failures existed on both public and admin
                pages.
                Both layers are now clean. reflow.spec.ts gates /, /browse,
                /user/login and /communities; admin-reflow.spec.ts gates 13
                admin pages; and the inventory-wide checkReflow, which
                covers every page in both inventories, reports zero 1.4.10
                findings across 360 result files on the most recent
                successful main run (37865757336).
                Five defects were fixed to get here. On the public side,
                /communities required 349px at a 320px viewport (PR #2325).
                On the admin side, issue #2336 covered 14 pages measuring
                357px to 507px, which traced to four causes rather than 14
                separate defects: the shortcut tooltip beside the page title
                (PR #2337), the breadcrumb wrapper (PR #2339), the sticky
                form actions bar (PR #2340), and on the submission form
                settings a fixed-width select together with visually-hidden
                labels escaping Gin's table scroll wrapper (PR #2364).
                One page in #2336, collection organization, takes a
                discovered node id rather than a fixed path, so it is
                covered by the inventory-wide check and was verified by hand
                at 320px, 480px and 1280px rather than added to the gating
                spec.
                Wide data tables still scroll horizontally inside their own
                container, which 1.4.10 permits for content that needs a
                two-dimensional layout; the page itself does not scroll.
                Text resize (1.4.4) is a separate criterion and is evaluated
                separately; several pages still overflow at 200% text size.
                Evidence is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md
                and
                docs/accessibility/findings/2026-10-06-automated-evidence-prefill.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.11
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Evaluated for focus indicators, the theme's principal
                non-text contrast surface. The shared focus ring colour
                was #66afe9, measuring 1.59-2.37:1 against every light
                surface in the palette; it is now currentcolor, so each
                ring inherits text colour already chosen to contrast
                with its background, with hard-coded rings where that is
                unsafe (white-on-dark fills, and controls over uploaded
                imagery). Verified in September 2026 across 25
                components x 2 palettes in an isolated fixture on the
                compiled CSS, plus 101 focusable elements on seven
                running pages, with no result below 3:1 (issue #2199, PR
                #2221). Non-text contrast of other graphical objects
                (icon-only affordances, map controls) is queued for the
                manual audit cycle. Evidence for the September 2026
                changes is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.12
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.13
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.5
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                More than one way is available to reach
                content. The site offers a search box in the
                header on every page, a main navigation menu,
                and browse listings reached from the home
                page, including browse by community and by
                collection. Any two of these satisfy the
                criterion independently, so no sitemap is
                required, and none is installed. Evidence is
                recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.6
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.7
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: ""
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.1.2
        components:
          - name: web
            adherence:
              level: does-not-support
              notes: >-
                Dictionary content cannot express its
                language. Every dictionary word carries a
                required reference to a term in the language
                vocabulary, but that vocabulary has no fields,
                so there is no ISO 639 or BCP 47 code for a
                template to place in a lang attribute, and no
                template emits one (issues #2328, #2353,
                #2354, #2357). Local Contexts labels do emit
                lang correctly, so the gap is specific rather
                than systemic. Evidence is recorded in
