title: Mukurtu CMS Accessibility Conformance Report
product:
  name: Mukurtu CMS
  version: "4"
  description: >-
    Mukurtu CMS is a free, mobile, and open source platform built with
    Indigenous communities to manage and share digital cultural heritage.
    It is a distribution of the Drupal content management system.
author:
  name: "Mukurtu CMS Development Team"
  company_name: "Center for Digital Scholarship and Curation, Washington State University"
  address: ""
  email: "support@mukurtu.org"
  phone: ""
  website: "https://mukurtu.org"
report_date: "2026-07-10"
last_modified_date: "2026-10-09"
version: 3
notes: >-
  This is a living document maintained as part of the Mukurtu CMS
  accessibility program (see docs/accessibility/README.md in the Mukurtu CMS
  repository). All criteria begin as not-evaluated and are updated as audit
  findings are triaged. Assessments reflect Mukurtu CMS itself (its
  installation profile, custom modules, and the mukurtu_v4 theme); conformance
  of an individual Mukurtu site also depends on its content and configuration.
evaluation_methods_used: >-
  Automated scanning with axe-core (via Playwright) across a representative
  page inventory covering anonymous, member and administrative pages,
  together with purpose-built checks for criteria axe cannot assert on its
  own: reflow, text resize, text spacing, focus visibility, link text,
  keyboard traps, label in name and input purpose. Several of those also gate
  continuous integration, so a regression fails a build rather than only
  being reported; the rest are report-only and are treated as indicators
  rather than evidence. Criteria decidable from source, configuration and
  content were evaluated by desk review, and each finding was confirmed
  against a clean install before a conformance level was assigned. Findings
  are consolidated by WCAG Success Criterion before levels are assigned.
  Manual keyboard-only testing and screen reader testing (NVDA, VoiceOver or
  Orca) following the program's manual testing checklist are planned but have
  not yet been carried out. Criteria that depend on them remain
  not-evaluated. Where an evaluated criterion still has manual
  verification outstanding, its own note says so: 4.1.2 is the one such
  case, where keyboard and screen reader verification of the custom
  widgets is still to come.
legal_disclaimer: >-
  The information herein is provided in good faith based on the analysis of
  the product at the time of the review and does not represent a
  legally-binding claim. Please contact us to report any accessibility errors
  or conformance claim errors for re-evaluation and correction, if necessary.
repository: "https://github.com/MukurtuCMS/Mukurtu-CMS"
feedback: "https://github.com/MukurtuCMS/Mukurtu-CMS/issues"
license: GPL-2.0-or-later
related_openacrs:
  - url: "https://github.com/GSA/openacr/blob/main/openacr/drupal-9.yaml"
    type: secondary
chapters:
  success_criteria_level_a:
    notes: >-
      Mukurtu CMS is a Drupal distribution. The "Web" component below covers
      the product's whole browser interface, the visitor and member
      experience and the administrative one alike, and the page inventory
      behind these assessments includes all three. The "Authoring Tool"
      component covers conformance with ATAG 2.0, which asks additionally
      that an authoring tool help its authors produce accessible content; it
      will be evaluated in a later phase.
    criteria:
      - num: 1.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated checks (axe-core, July 2026) across the audited page
                inventory found no missing text alternatives. Map location
                markers previously exposed as unnamed buttons were fixed to
                carry the name of the item whose location they show. Alt text
                quality on real site content is author-dependent and is
                reviewed in the manual audit cycle.
          - name: authoring-tool
            adherence:
              level: supports
              notes: >-
                Authors are prompted for alt text wherever they add an image.
                Alt is required on seven of the eight image fields across
                media bundles, including field_media_image on the Image
                bundle, which is the path authors use, and on the article
                image and footer logo fields. Two exceptions remain: the
                document thumbnail and the user picture. The tool cannot judge
                whether the text entered is a useful description, which no
                authoring tool can.
      - num: 1.2.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Capability check. Digital heritage items carry
                field_transcription, described as a basic text
                transcription of an audio or video recording,
                and it is rendered on the full and
                taxonomy_record displays, so an author can
                provide a text alternative and a visitor can
                read it. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.2.2
        components:
          - name: web
            adherence:
              level: partially-supports
              notes: >-
                Locally hosted video cannot carry captions.
                The video media type offers an author no
                caption or subtitle track field, and the
                file_video formatter renders no track element,
                so a site that uploads its own video has no
                way to provide synchronised captions (issue
                #2329). The remote_video type is unaffected,
                because the provider carries its own captions.
                A transcript is not a substitute: it satisfies
                1.2.3, which accepts a media alternative, but
                not 1.2.2, which requires synchronisation. The
                same evidence bears on the authoring-tool
                component, which is evaluated separately.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: supports
              notes: >-
                The video media type carries caption and subtitle tracks
                (issues #2329 and #2358), and the track widget requires a
                language to be chosen for each track, so one cannot be added
                without saying what language it is in. Whether an author
                supplies a track for a given video is editorial work the tool
                cannot do for them.
      - num: 1.2.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                The digital heritage transcription field is a
                media alternative, which 1.2.3 accepts in
                place of audio description. Caveat: the field
                is described to authors as a basic
                transcription, so whether any given item's
                text is a full alternative is editorial rather
                than structural. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated structural checks (axe-core, July 2026) pass
                across the audited page inventory. The page title region
                was moved inside the main landmark so all page content
                is contained by landmarks (fixed July 2026). Landing
                pages previously derived their heading level from
                whether the page was the front page, so a page could
                emit several first-level headings or none at all
                depending on which blocks an author placed; heading
                levels are now fixed and the front page carries exactly
                one visually-hidden first-level heading regardless of
                block placement (September 2026, issue #2176, PR #2207).
                Heading outline quality and reading order are verified
                in the manual audit cycle. Evidence for the September
                2026 changes is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
          - name: authoring-tool
            adherence:
              level: supports
              notes: >-
                The rich text editor gives authors headings, ordered and
                unordered lists and blockquotes, with tables in the full HTML
                format, so structure is expressed as markup rather than as
                visual formatting. The text formats restrict saved output to
                those elements, so an author cannot store structure the theme
                has no semantics for. The tool does not check that an author
                chose the right heading level.
      - num: 1.3.2
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. Whether the reading sequence preserves
                meaning is a judgement made by listening to each page, not
                something a scan decides. Needs the screen reader pass,
                tracked in issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No UI string gives an instruction by position,
                shape, size or colour alone, checked across
                the product's module and theme strings.
                Instructions as rendered, rather than as
                authored, are confirmed in the visual pass.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.1
        components:
          - name: web
            adherence:
              level: partially-supports
              notes: >-
                Required fields are marked with an asterisk
                glyph rather than colour, and form errors name
                the field in text, so those do not rely on
                colour. System messages do. Error, warning and
                status blocks are distinguished from one
                another only by background colour: there is no
                icon, the left border is identical and
                transparent on all three, padding is
                identical, and the only text cue is a
                visually-hidden heading that a sighted reader
                never sees. The wording of a message often
                makes its nature clear on its own, which
                limits the practical impact, but severity
                itself is carried visually by colour alone.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Nothing autoplays. The dictionary audio
                display sets autoplay false, the lightbox sets
                autoplayVideos false, and the YouTube oEmbed
                lists autoplay in its allow attribute, which
                is a permission rather than an instruction,
                with no autoplay parameter in the URL.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.1.1
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. Deciding this needs a person to operate
                every interactive component from the keyboard alone. Automated
                scans cover three narrow cases across the audited inventory
                and report no failures: focusable content inside frames,
                scrollable regions that cannot be reached by keyboard, and
                server-side image maps. The full pass is the keyboard bucket
                in the manual audit runbook, tracked in issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.1.2
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. A custom check tabs through every page in
                the audited inventory and reports no trap, but it can only
                find a trap it is able to escape by tabbing, so a component
                that captures the keyboard in a way the check cannot reproduce
                would go unseen. Confirming it needs a person. Tracked in
                issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.1.4
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Every file binding keydown or keypress uses
                non-printable keys, except Enter and Space in
                two places, both scoped to a focused element.
                The active-only-on-focus exception applies,
                and activating a control with Enter or Space
                is standard operation rather than a shortcut.
                Enforced in CI by the character-key-shortcuts
                lint, which fails the build on a
                single-character handler bound to document,
                window or body, and self-tests its matcher
                before trusting it. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.2.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No time limits. No meta refresh, no
                location.reload and no setInterval in the
                product's JavaScript, and no session lifetime
                override is shipped. Drupal's session expiry
                is a security timeout, which 2.2.1 exempts.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.2.2
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: >-
                No content moves, blinks, scrolls or updates
                automatically, so there is nothing for a
                pause, stop or hide control to act on. Both
                carousels are instantiated without the
                autoplay option, which the carousel library
                defaults to off; no audio or video autoplays;
                and the product's own stylesheets define no
                keyframe animation. The only animation present
                anywhere is a vendor carousel's loading
                spinner, which is not presented in parallel
                with other content. Evidence is recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.3.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No keyframe animation in any of the product's
                own stylesheets. The only animation present is
                a vendor carousel's rotating loading spinner,
                which does not flash. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                A skip-to-main-content link is provided on every page, and as
                of July 2026 the page heading sits inside the skip link's
                target landmark. Automated checks report no findings from
                axe's bypass rule, though a failing bypass check is
                downgraded to "needs review" rather than reported as a
                violation, so from October 2026 those results are reported
                separately instead of being queued with items that need
                human judgement (PR #2427). Keyboard verification of the
                skip link across page types is part of the manual audit
                cycle.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated checks (axe-core, July 2026) confirm every audited
                page has a page title. Title descriptiveness is reviewed with
                headings and labels (2.4.6) in the manual audit cycle.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.3
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. Whether the focus order preserves meaning
                and operability is a judgement about sequence that no
                automated check makes. Needs the keyboard pass, tracked in
                issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.4
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. Automated checks cover the mechanical part
                across the audited inventory and report no failures: every
                link and image map area has an accessible name, and a custom
                check flags link text that cannot stand on its own, such as
                "read more" or a bare URL. Whether a link's purpose is clear
                from its context remains a judgement, so the determination
                waits on the screen reader pass, tracked in issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.5.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No functionality requires a path-based or
                multipoint gesture. Maps are the only
                candidate: the map library's pinch-zoom is
                available on a touch screen, but the zoom
                control buttons ship enabled on every map
                display, so zooming has a single-pointer
                alternative. The media lightbox deliberately
                does not implement pinch-zoom, and says so in
                its own source. Evidence is recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.5.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No functionality is triggered by the down
                event. The product binds no mousedown or
                pointerdown handlers at all; activation
                happens on click, which fires on the up event
                and can be aborted by moving the pointer away
                before releasing. Evidence is recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.5.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Evaluated with checkLabelInName across
                anonymous and administrative pages, which
                compares each control's accessible name
                against its visible label and reports a
                control whose name does not contain its label.
                Zero findings across the home page, browse,
                login, registration, communities, the admin
                overview, content and people listings, the
                digital heritage node form, submission
                settings and the communities and protocols
                manager. The check approximates the accessible
                name computation rather than implementing all
                of it, so it is a strong indicator rather than
                a proof; an earlier version placed the title
                attribute ahead of text content and reported
                21 false positives before that was corrected.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.5.4
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: >-
                No devicemotion, deviceorientation or
                DeviceMotionEvent handler exists anywhere in
                the product's modules or themes, so no
                functionality is operated by device motion.
                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated checks (axe-core, July 2026) confirm a valid lang
                attribute on the html element of every audited page. Language
                of parts (3.1.2) for content in Indigenous languages is a
                separate criterion and remains under evaluation.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.2.1
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. Finding a change of context on focus means
                moving focus through every component and watching for one.
                Tracked in issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.2.2
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. As for 3.2.1, but for changing a setting
                rather than focusing it: someone has to operate each control
                and watch for an unexpected change of context. Tracked in
                issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.3.1
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. Deciding this means submitting each form
                with input it should reject and reading what comes back.
                Tracked in issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.3.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Labels or instructions are provided wherever
                input is required. Most controls carry a
                visible label. Where one is visually hidden it
                is because a visible column header labels the
                column, which covers 31 of the 47 such
                controls on the richest form in the product.
                The remaining 16, on the submission settings
                field groups, sit under a visible fieldset
                instruction explaining what the groups do, and
                each control carries a programmatic label plus
                either a placeholder or a self-describing
                default option. The criterion asks that labels
                or instructions be provided, not that every
                label be visible. Evidence is recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 4.1.1
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Satisfied by definition in HTML5, and removed
                from WCAG in 2.2. Recorded with its reasoning
                rather than tested. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 4.1.2
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated ARIA checks (axe-core) run across the audited
                page inventory, including protocol-gated member views. Map
                location markers previously rendered as focusable buttons
                with no accessible name were fixed (July 2026). Two further
                defects were found in October 2026 and fixed: all 16 Mukurtu
                Dashboard menu blocks shared one heading ID, so every
                navigation region was labelled by the first heading on the
                page (issue #2395, PR #2398), and the front-end main
                navigation landmark carried no accessible name (PR #2428).
                Neither could appear as a violation in the scan, because axe
                downgrades a failing duplicate-id-aria, frame-title-unique
                or aria-braille-equivalent check to "needs review"; results
                from those rules are reported separately from October 2026
                (PR #2427). Keyboard and screen reader verification of
                custom widgets (carousel, tabs, audio player, autocomplete)
                is part of the manual audit cycle.
          - name: authoring-tool
            adherence:
              level: partially-supports
              notes: >-
                Authors do not write ARIA. The text formats restrict saved
                markup to a known set of elements and attributes, so content
                created through the editor cannot introduce an incorrect name,
                role or value. The source editing button, available in the
                full HTML format, does allow raw markup and nothing checks
                what is pasted there. The accessible-name defects previously
                reported in this row were in the authoring interface itself;
                under this report's scoping those belong to the Web component
                and are recorded there.
  success_criteria_level_aa:
    notes: ""
    criteria:
      - num: 1.2.4
        components:
          - name: web
            adherence:
              level: not-applicable
              notes: >-
                No live-streaming or real-time media
                capability exists in the product, so there is
                no live content to caption. Recorded as
                not-applicable rather than supports, which are
                different claims. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.2.5
        components:
          - name: web
            adherence:
              level: does-not-support
              notes: >-
                No synchronised audio description capability for
                locally hosted video: the video media type has no
                described-track field and the player renders no track
                element (issue #2355). A transcript does not satisfy
                1.2.5, which requires description synchronised with the
                video. The remote_video type depends on the provider.
                Captions and subtitles are supported and cover 1.2.2.
                Building the capability is a decision taken and
                deferred, not an oversight: even with the field and a
                player control in place, whether any given item has a
                described version is editorial work in each community,
                so the level could reach partially-supports but never
                supports. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: does-not-support
              notes: >-
                The tool gives authors no way to attach an audio-described
                version of a video. Building the capability is a decision
                taken and deferred, not an oversight (issue #2355). Captions
                and subtitles are supported and cover 1.2.2. Even with the
                capability in place this could reach partially-supports but
                never supports, because whether an item has a described
                version is editorial work in each community.
      - num: 1.3.4
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No orientation lock. The theme's breakpoint
                map defines portrait and landscape aliases,
                but nothing uses them to restrict display to a
                single orientation. Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.3.5
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Every field that collects information about the user
                carries the matching autocomplete token. The login
                form uses username and current-password. The account
                form does too when a person edits their own account:
                core's AccountForm sets autocomplete="off" on the
                username, email and password fields whenever the
                form is not a registration, and mukurtu_core
                overrides that for self-editing only (issue #2372).

                The restriction core added is kept where it earns
                its place. When an administrator edits somebody
                else's account the fields stay at off, so a browser
                cannot offer the administrator's own saved details
                on another person's record. input-purpose.spec.ts
                gates both directions on every build: three fields
                asserted to carry their token on self-edit, and a
                negative control asserting they keep off on another
                account, using a second signed-in session to prove
                the two are different accounts.

                Measured inventory-wide on the main run at 05ca5a668
                (run 38752434462): checkInputPurpose reports zero
                findings across 29 pages.

                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Automated contrast checks (axe-core, July 2026) pass
                across the audited page inventory. A failing admin
                accent color (4.48:1) reachable by members on
                /my-content was darkened to 5.3:1 (fixed July 2026). Two
                of the three cases automated tools cannot judge have
                since been measured and fixed (September 2026): hero
                text over author-uploaded photographs, where a
                light/dark toggle could not meet the criterion over an
                arbitrary image, now carries an opaque per-glyph stroke
                whose contrast against the fill is fixed independent of
                the photograph (5.00:1 and 8.39:1 for the two built-in
                palettes; issue #2175, PR #2207); and the horizontal
                image-with-description panel, which failed at 2.45:1 on
                the Blue and gold palette, now uses a per-palette token
                reaching 4.78:1 (issue #2178, same PR). Map controls
                remain queued for manual contrast measurement. Evidence
                for the September 2026 changes is recorded by criterion
                in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
          - name: authoring-tool
            adherence:
              level: supports
              notes: >-
                Where an author chooses colours, the tool checks them. The
                custom palette lets a site set six colours written straight
                into the stylesheet. PaletteContrastAnalyzer compares them
                against the theme's real colour pairings, derived from the
                compiled stylesheet rather than a hand-maintained list, and
                warns on each pairing below the WCAG AA ratio, naming the
                ratio, the requirement and an affected component. It warns
                rather than blocks, so a site can still ship a failing palette
                deliberately. Added for issue #1054, which the code records as
                an ATAG 2.0 B.2.2 gap.
      - num: 1.4.4
        components:
          - name: web
            adherence:
              level: partially-supports
              notes: >-
                Evaluated with checkTextZoom, which doubles the
                browser's own default font size through the Chrome
                DevTools Protocol and reloads the page with it
                already set, so that rem media queries re-evaluate
                the way they do for a reader who has chosen a larger
                text size.

                Forty-three of the 45 pages in the inventory need no
                horizontal scrolling at 200%. Two do: the Local
                Contexts supported projects pages, for a community
                and for a protocol, each reporting 1485px of content
                in a 1280px viewport. The same two pages at the same
                width failed on two separate main runs (38003543030
                and 38064032171), so this is stable rather than
                intermittent, and every other automated check on
                those two pages is clean (issue #2392).

                Page zoom, as distinct from text size, is not
                covered by this check.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.5
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                No images of text. The only image the product
                renders on its own pages is the site logo,
                which the criterion exempts. Every other
                graphic in the theme is an icon or interface
                decoration carrying no text. Evidence is
                recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.10
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Raised back to supports in October 2026, on the evidence of
                a clean run rather than on the strength of the fixes alone.
                The criterion was downgraded earlier that month because the
                previous claim said automated reflow testing asserts no
                horizontal scrolling at 320px "across the page inventory",
                which conflated the gating spec with a report-only check,
                and because real failures existed on both public and admin
                pages.
                Both layers are now clean. reflow.spec.ts gates /, /browse,
                /user/login and /communities; admin-reflow.spec.ts gates 13
                admin pages; and the inventory-wide checkReflow, which
                covers every page in both inventories, reports zero 1.4.10
                findings across 360 result files on the most recent
                successful main run (37865757336).
                Five defects were fixed to get here. On the public side,
                /communities required 349px at a 320px viewport (PR #2325).
                On the admin side, issue #2336 covered 14 pages measuring
                357px to 507px, which traced to four causes rather than 14
                separate defects: the shortcut tooltip beside the page title
                (PR #2337), the breadcrumb wrapper (PR #2339), the sticky
                form actions bar (PR #2340), and on the submission form
                settings a fixed-width select together with visually-hidden
                labels escaping Gin's table scroll wrapper (PR #2364).
                One page in #2336, collection organization, takes a
                discovered node id rather than a fixed path, so it is
                covered by the inventory-wide check and was verified by hand
                at 320px, 480px and 1280px rather than added to the gating
                spec.
                Wide data tables still scroll horizontally inside their own
                container, which 1.4.10 permits for content that needs a
                two-dimensional layout; the page itself does not scroll.
                Text resize (1.4.4) is a separate criterion and is evaluated
                separately; several pages still overflow at 200% text size.
                Evidence is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md
                and
                docs/accessibility/findings/2026-10-06-automated-evidence-prefill.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.11
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Evaluated for focus indicators, the theme's principal
                non-text contrast surface. The shared focus ring colour
                was #66afe9, measuring 1.59-2.37:1 against every light
                surface in the palette; it is now currentcolor, so each
                ring inherits text colour already chosen to contrast
                with its background, with hard-coded rings where that is
                unsafe (white-on-dark fills, and controls over uploaded
                imagery). Verified in September 2026 across 25
                components x 2 palettes in an isolated fixture on the
                compiled CSS, plus 101 focusable elements on seven
                running pages, with no result below 3:1 (issue #2199, PR
                #2221). Non-text contrast of other graphical objects
                (icon-only affordances, map controls) is queued for the
                manual audit cycle. Evidence for the September 2026
                changes is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.12
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Evaluated with checkTextSpacing, which applies
                the line height, letter spacing, word spacing
                and paragraph spacing the criterion specifies,
                then detects both page overflow and elements
                clipping their own text. Zero findings across
                the home page, browse, login, the admin
                overview, the content listing and the digital
                heritage node form. An earlier version of that
                check reported 125 findings, of which 121 were
                visually-hidden elements matching the
                one-pixel clipped-box shape by design; it was
                corrected in PR #2366 before this evaluation,
                so the clean result reflects the content
                rather than a broken measurement. Evidence is
                recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 1.4.13
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. Tooltips and similar content have to be
                checked for being dismissable, hoverable and persistent, which
                means driving each one by hand. Tracked in issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.5
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                More than one way is available to reach
                content. The site offers a search box in the
                header on every page, a main navigation menu,
                and browse listings reached from the home
                page, including browse by community and by
                collection. Any two of these satisfy the
                criterion independently, so no sitemap is
                required, and none is installed. Evidence is
                recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.6
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. An automated check can tell that a heading
                or label exists; it cannot tell whether it describes its topic
                or purpose, which is what this criterion asks. Tracked in
                issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 2.4.7
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Every element in the tab order shows a focus
                indicator, across the whole page inventory. Measured
                on the main run at 05ca5a668 (run 38752434462): 45
                pages, zero findings, including the administrative
                forms and the three pages carrying a rich text
                editor. The check's own negative control still
                reported its three deliberately unstyled elements on
                the same run, so the clean result reflects the pages
                rather than a check that stopped working.

                Two defects were fixed to get here. The Gin admin
                theme left each form's original action buttons in
                the tab order inside a one-pixel container, so focus
                could land on a control with none of its box on
                screen, and on a confirmation form the only Cancel a
                keyboard could reach was the invisible one; that is
                fixed and gated by admin-focus-visible.spec.ts,
                which fails the build if it returns (issue #2389).
                The inventory-wide check itself was reporting
                elements at tabindex="-1", which are not in the tab
                order, so CKEditor's toolbar container produced a
                finding on every page with an editor; the check now
                skips them (issue #2419).

                Indicators are not all outlines: the main navigation
                draws a pseudo-element ring, and CKEditor draws a
                box-shadow ring plus a border change, so a check
                reading only the outline property reports both as
                missing. What the automated layer does not decide is
                whether a container a script focuses deliberately,
                such as a dialog on open, needs a visible ring; that
                is left to the manual keyboard pass.

                Evidence is recorded in
                docs/accessibility/findings/2026-10-15-focus-visible-clean-run.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.1.2
        components:
          - name: web
            adherence:
              level: partially-supports
              notes: >-
                The language vocabulary now carries a Language code
                field, and dictionary templates place it in a lang
                attribute. Verified on a running site: a word whose
                language term holds haw renders its page title as
                <h1 lang="haw"> and marks the title field and both
                alternate spellings the same way, and renders no
                lang at all when that code is left blank, which is
                the documented behaviour rather than a silent
                failure. Additional entry terms and sample sentences
                are marked by the same mechanism, including sample
                sentences nested under an entry. Local Contexts
                labels emit lang correctly as before.

                The rest of the content cannot express its language.
                Digital heritage titles, descriptions and
                transcriptions, taxonomy term names, and collection
                and community descriptions can all hold
                Indigenous-language text with no way to mark it. The
                digital heritage Language field cannot be reused for
                this: it records the languages present in an item
                including its media assets, is unlimited in
                cardinality and creates terms on the fly, so reading
                it as "this title is written in X" would mark text
                as the wrong language, which helps a screen reader
                user less than leaving it unmarked (issues #2354,
                #2357). Within the dictionary, definition,
                pronunciation, translation and word origin are
                assumed to be in the site's language. That is right
                for most sites and wrong for a site writing a
                monolingual dictionary, and it is not configurable
                (issue #2353).

                Recorded as does-not-support in October 2026 because
                the vocabulary had no code field and no template
                emitted one. Both arrived in #2352; this level
                reflects what the product does now, not the fix
                alone. Evidence is recorded in
                docs/accessibility/findings/2026-10-13-language-of-parts.md.

          - name: authoring-tool
            adherence:
              level: partially-supports
              notes: >-
                Authors can mark a run of text with its language in the rich
                text editor. The Language button is fed from the site's own
                language vocabulary rather than a fixed list, so a community's
                languages are selectable under their own names (PR #2440), and
                a language marked as read right to left also carries dir (PR
                #2441). The gap is plain text: titles, names and taxonomy term
                names cannot hold inline markup, so text in those fields
                cannot be marked at all. Recorded when issue #2354 closed.
      - num: 3.2.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Navigation appears in the same relative order
                on every page. Checked as a visitor across the
                home page, browse, communities and login: the
                main menu is identical in content and order on
                all four, as are the header search, the skip
                link and the site logo's target. Evidence is
                recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.2.4
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Components with the same function are labelled
                the same way across pages. The header search
                button, the skip link and the site logo link
                are identical on the home page, browse,
                communities and login. Evidence is recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.3.3
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Error messages suggest a correction where one
                is known. A malformed email address returns
                "The email address is not valid. Use the
                format user@example.com", which names both the
                problem and the expected form. Required-field
                errors name the field and what is needed, for
                example "At least one Cultural Protocol must
                be selected". Evidence is recorded in
                docs/accessibility/findings/2026-10-09-visual-pass.md.

          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 3.3.4
        components:
          - name: web
            adherence:
              level: supports
              notes: >-
                Deletion of entities goes through a confirmation
                form throughout: 19 classes extend a confirm or
                delete form base, covering communities, protocols,
                collections, exports, import strategies, memberships
                and legacy labels, and the Views Bulk Operations
                delete action on the media listing sets
                add_confirmation.

                Bulk removal of group memberships was the exception
                and is no longer. The members overview uses Organic
                Groups' own bulk form, which offers no confirmation
                option, so the delete action now stages the
                selection in a tempstore and the form's
                confirm_form_route_name sends the person to a
                confirm step that names every member it is about to
                remove, and separately lists any it cannot remove
                with the reason (issue #2370). Twelve kernel tests
                cover it, including that running the action alone
                removes nobody.

                Evidence is recorded in
                docs/accessibility/findings/2026-10-06-desk-review.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
      - num: 4.1.3
        components:
          - name: web
            adherence:
              level: not-evaluated
              notes: >-
                Not yet evaluated. A status message has to reach assistive
                technology without taking focus, which means listening for it
                with a screen reader. Tracked in issue #2242.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
