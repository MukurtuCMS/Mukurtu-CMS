          - name: web
            adherence:
              level: supports
              notes: >-
                Automated structural checks (axe-core, July 2026) pass
                across the audited page inventory. The page title region
                was moved inside the main landmark so all page content
                is contained by landmarks (fixed July 2026). Landing
                pages previously derived their heading level from
                whether the page was the front page, so a page could
                emit several first-level headings or none at all
                depending on which blocks an author placed; heading
                levels are now fixed and the front page carries exactly
                one visually-hidden first-level heading regardless of
                block placement (September 2026, issue #2176, PR #2207).
                Heading outline quality and reading order are verified
                in the manual audit cycle. Evidence for the September
                2026 changes is recorded by criterion in
                docs/accessibility/findings/2026-09-17-remediation-cycle.md.
          - name: authoring-tool
            adherence:
              level: not-evaluated
              notes: ""
