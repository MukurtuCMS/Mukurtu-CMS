              level: partially-supports
              notes: >-
                Deletion of entities goes through a
                confirmation form throughout: 19 classes
                extend a confirm or delete form base, covering
                communities, protocols, collections, exports,
                import strategies, memberships and legacy
                labels, and the Views Bulk Operations delete
                action on the media listing sets
                add_confirmation. Bulk removal of group
                memberships does not. The members overview
                uses Organic Groups' own bulk form rather than
                Views Bulk Operations, which offers no
                confirmation option, and its delete action
                removes each membership immediately. Re-adding
                a member does not restore their roles, so the
                action is neither reversible, checked nor
                confirmed (issue #2370). Evidence is recorded
                in
                docs/accessibility/findings/2026-10-06-desk-review.md.

