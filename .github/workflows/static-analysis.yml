name: Static Analysis

# Pull requests only. This workflow deliberately does not run on pushes to
# main or develop, so it is only ever exercised against feature branches.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only. These jobs check out the code and run linters; nothing here
# writes to the repository, comments, or pushes a branch.
permissions:
  contents: read

jobs:
  # Dependency advisories. Reads composer.lock only, so this needs no install
  # and no Drupal build. Kept separate from the analysis job because it is fast
  # and because its failures mean something quite different.
  #
  # This is not redundant with Dependabot: the GitHub Advisory Database carries
  # advisories for only a handful of our drupal/* dependencies, whereas
  # `composer audit` also reads drupal.org's own security advisory feed via the
  # packages.drupal.org repository. It is also a gate rather than a notification.
  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction

  static-analysis:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    # Both checks below are REPORT-ONLY while the large stacked PRs land, so
    # they give per-PR visibility without ever blocking that work. Flipping this
    # single value to '1' turns both into gates. Same convention as
    # scripts/lint/multilingual-guardrails.sh.
    #
    # Intended order: land this wiring -> land the phpcbf sweep -> flip to '1'.
    # PHPStan is already clean against its baseline, so it could be gated first
    # if the sweep drags on; PHPCS cannot be until the sweep lands.
    env:
      MUKURTU_LINT_STRICT: '0'
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Get composer cache directory
        id: composercache
        run: echo "COMPCACHE=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: $COMPCACHE
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # PHPStan needs a real docroot to resolve core and contrib namespaces, so
      # the profile is analysed inside a full template build. Mirrors the setup
      # in build-and-test.yml.
      - name: Install Mukurtu Template
        run: |
          composer create mukurtu/mukurtu-template:^4.0 . --no-install --no-interaction
          rm web/profiles/mukurtu -rf

      # fetch-depth: 0 so the PR base commit is available for diff scoping.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: web/profiles/mukurtu
          fetch-depth: 0

      - name: Install Mukurtu
        run: |
          # The path repo must declare a version. mukurtu-template requires
          # mukurtu/mukurtu ^4.0, and composer derives a path package's version
          # from its git branch, giving dev-<branch> for a PR checkout. That
          # cannot satisfy ^4.0, and a path repo is canonical, so composer
          # refuses to fall back to the released package on Packagist and the
          # whole install fails. Mirrors build-and-test.yml; see #2150.
          composer config repositories.local-dev '{"type":"path","url":"web/profiles/mukurtu","options":{"versions":{"mukurtu/mukurtu":"4.9999.9999"}}}'
          composer install --no-interaction --optimize-autoloader

      # PHPCS is scoped to the files a PR touches. The tree carries ~4,900
      # pre-existing errors (3,633 of them auto-fixable by phpcbf), dense
      # enough that a five-file PR can inherit ~160. Gating on that would tax
      # every author for debt they did not create, which is why the sweep has
      # to land before MUKURTU_LINT_STRICT flips.
      - name: PHPCS (changed files)
        working-directory: web/profiles/mukurtu
        run: |
          set -uo pipefail
          # fetch-depth: 0 above should already provide this; fetching again
          # is cheap insurance against a shallow or pruned base ref. Failure is
          # tolerated because the ref is usually already present, but it is
          # reported rather than swallowed: if merge-base then fails, this line
          # is the explanation.
          if ! git fetch --no-tags --quiet origin "${{ github.base_ref }}"; then
            echo "Note: could not fetch origin/${{ github.base_ref }}; relying on the existing checkout."
          fi
          # Not `BASE=$(git merge-base ...)` on its own: GitHub runs this as
          # `bash -e`, so a failed command substitution would abort the step
          # with a bare exit 128 and no indication of what went wrong.
          if ! BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD); then
            echo "::error::Could not determine the merge base against origin/${{ github.base_ref }}."
            echo "PHPCS is scoped to files changed since that point, so there is nothing to diff."
            exit 1
          fi
          echo "Diffing against $BASE"
          # ACMR: added/copied/modified/renamed. Deleted files must not be linted.
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD \
            -- '*.php' '*.module' '*.inc' '*.install' '*.profile' '*.theme')
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No PHP files changed; nothing to check."
            exit 0
          fi
          printf 'Checking %s changed file(s):\n' "${#FILES[@]}"
          printf '  %s\n' "${FILES[@]}"
          # GitHub runs `run:` steps with `bash -e`, so a non-zero exit would
          # kill this step before the report-only branch below. `|| STATUS=$?`
          # keeps the failure inspectable instead of fatal.
          STATUS=0
          ../../../vendor/bin/phpcs --standard=phpcs.xml.dist \
            --warning-severity=0 --report=full "${FILES[@]}" || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            echo
            echo "PHPCS reported violations. Most are auto-fixable:"
            echo "    composer run lint:phpcs:fix"
            if [ "${MUKURTU_LINT_STRICT}" = "1" ]; then
              exit "$STATUS"
            fi
            echo "MUKURTU_LINT_STRICT is not 1, so this is reported without failing."
          fi

      # PHPStan runs whole-tree against a committed baseline of 138 known
      # errors, so anything it reports is NEWLY introduced by the PR. It is
      # already clean, so this reports nothing until someone adds an error.
      - name: PHPStan
        working-directory: web/profiles/mukurtu
        run: |
          set -uo pipefail
          # See the PHPCS step: `bash -e` would abort before the branch below.
          STATUS=0
          ../../../vendor/bin/phpstan analyse -c phpstan.neon.dist \
            --no-progress --memory-limit=-1 || STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            # Two very different failures land here, and they must not be
            # treated alike.
            #
            #   ignore.unmatched - a baseline entry stopped matching, because
            #     the error it describes was fixed or the code moved. Nothing
            #     is wrong with the branch; the baseline just needs
            #     regenerating. PHPStan reports this as non-ignorable, so it
            #     would otherwise block a merge for doing the right thing.
            #
            #   anything else - genuinely new, introduced by this branch.
            #
            # Re-run in JSON to classify. The result cache from the run above
            # is still warm, so this costs seconds, not another full analysis.
            ../../../vendor/bin/phpstan analyse -c phpstan.neon.dist \
              --no-progress --memory-limit=-1 --error-format=json \
              > /tmp/phpstan.json 2>/dev/null || true
            TOTAL=$(jq '[.files[].messages[]] | length' /tmp/phpstan.json 2>/dev/null || echo 0)
            STALE=$(jq '[.files[].messages[] | select(.identifier == "ignore.unmatched")] | length' /tmp/phpstan.json 2>/dev/null || echo 0)
            echo
            if [ "$TOTAL" -gt 0 ] && [ "$STALE" -eq "$TOTAL" ]; then
              echo "All $TOTAL finding(s) are stale phpstan-baseline.neon entries:"
              echo "the errors they describe no longer occur. This branch introduced"
              echo "nothing. Refresh the baseline - it will shrink:"
              echo "    composer run lint:phpstan:baseline"
              echo
              echo "Not failing: a stale baseline is a maintenance task, not a regression."
              exit 0
            fi
            echo "$((TOTAL - STALE)) finding(s) are NOT in phpstan-baseline.neon, meaning"
            echo "this branch introduced them. Reproduce locally with:"
            echo "    composer run lint:phpstan"
            echo
            echo "Fix them rather than regenerating the baseline to silence them -"
            echo "the baseline is meant to shrink over time, never grow."
            if [ "$STALE" -gt 0 ]; then
              echo
              echo "($STALE of the $TOTAL are stale baseline entries; regenerating"
              echo "the baseline will clear those, but not the rest.)"
            fi
            if [ "${MUKURTU_LINT_STRICT}" = "1" ]; then
              exit "$STATUS"
            fi
            echo "MUKURTU_LINT_STRICT is not 1, so this is reported without failing."
          fi
