name: Test the Docker image

# Runs the image tests on a pull request that changes the image, so a break shows up
# there and not on release day. Pushes nothing. docker-edge.yml covers Mukurtu changes
# that break the image without touching these files.

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - scripts/docker/**
      - examples/docker/**
      - .github/workflows/docker-*.yml

permissions:
  contents: read

concurrency:
  group: docker-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (amd64)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: mukurtu-ci:image

      - name: Run the image tests
        env:
          MUKURTU_TEST_IMAGE: mukurtu-ci:image
        run: |
          failed=0
          for test in scripts/docker/test-*.sh; do
            echo "::group::$test"
            "$test" || { echo "::error::$test failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"
