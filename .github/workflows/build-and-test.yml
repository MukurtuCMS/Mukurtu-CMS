name: Mukurtu CI Tests
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for untranslated UI strings
        run: ./scripts/lint/multilingual-guardrails.sh
        env:
          MUKURTU_LINT_STRICT: '1'

      - name: Check update hook numbering
        run: ./scripts/lint/update-hook-numbering.sh
        env:
          MUKURTU_LINT_STRICT: '1'

  testing:
    name: Mukurtu v4 - PHP ${{ matrix.php-versions }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php-versions: ['8.4']
        test-suite: ["kernel", "unit"]
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_USER: db
          MYSQL_PASSWORD: db
          MYSQL_DATABASE: db
          MYSQL_ROOT_PASSWORD: db
        ports:
          - 3306:3306
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2

      - name: Setup Mysql client
        run: |
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get remove -y mysql-client mysql-common
          sudo apt-get install -y mysql-client

      - name: Get composer cache directory
        id: composercache
        run: echo "COMPCACHE=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: $COMPCACHE
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Install the mukurtu-template into the root, then remove the packaged
      # version of mukurtu-cms, which will be replaced by the git checkout.
      - name: Install Mukurtu Template
        run: |
          composer create mukurtu/mukurtu-template:^4.0 . --no-install --no-interaction
          rm web/profiles/mukurtu -rf

      # Usually checkout is the first action, but we set up the mukurtu-template
      # first, then put the checkout inside of it.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: web/profiles/mukurtu

      - name: Install Mukurtu
        run: |
          # The path repo must declare a version. mukurtu-template requires
          # mukurtu/mukurtu ^4.0, and composer derives a path package's version
          # from its git branch, giving dev-<branch> for a PR checkout. That
          # cannot satisfy ^4.0, and a path repo is canonical, so composer
          # refuses to fall back to the released package on Packagist and the
          # whole install fails. The alias is a placeholder standing for "the
          # 4.x checkout under test", high enough never to need bumping within
          # this major.
          composer config repositories.local-dev '{"type":"path","url":"web/profiles/mukurtu","options":{"versions":{"mukurtu/mukurtu":"4.9999.9999"}}}'
          composer install --no-interaction --optimize-autoloader
          cp ./web/profiles/mukurtu/phpunit.xml ./phpunit.xml

      - name: Mukurtu Tests
        run: |
          ./vendor/bin/phpunit --display-all-issues --testsuite "${{ matrix.test-suite }}"
        continue-on-error: false
