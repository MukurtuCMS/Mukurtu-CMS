name: Publish Docker image

# Builds the Mukurtu CMS image from a release tag, tests it, scans it, and pushes
# it to the GitHub Container Registry as ghcr.io/<owner>/mukurtu. How the image is
# built, and why, is documented in docs/docker-build.md.
#
#  - release published: build that release.
#  - workflow_dispatch: build a named tag by hand. Use this if the release was
#    created by another workflow with GITHUB_TOKEN, which does not trigger
#    `release: published`.
#
# A published tag is a fixed artifact: nothing rebuilds and re-pushes existing
# tags on a timer. Fixes to the base images or to Drupal reach users in a new
# release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish, for example 4.0.5. The tag must contain the Dockerfile."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the tag to build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the tag
        id: tag
        # Event data reaches the script through env:, never by interpolation
        # into the script text.
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == release ]]; then
            tag="$RELEASE_TAG"
          else
            tag="$INPUT_TAG"
          fi
          test -f Dockerfile || { echo "::error::Tag $tag does not contain a Dockerfile, so there is nothing to build."; exit 1; }
          # The tag is a Mukurtu release (4.0.5), an image revision of one
          # (4.0.5-r1), or a pre-release (4.0.0-rc). Anything else is refused.
          kind="$(scripts/docker/compute-tags.sh --kind "$tag")"
          # The tags are derived from the version alone, so GitHub's flag must
          # agree with it. Otherwise a release published as a pre-release would
          # take `latest`.
          if [[ "$RELEASE_IS_PRERELEASE" == true && "$kind" != prerelease ]]; then
            echo "::error::Release $tag is marked as a pre-release on GitHub, but its tag has no pre-release suffix such as -rc1. Re-tag it (for example ${tag}-rc1) so it cannot become 'latest'."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  test:
    name: Test and scan
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # Every scripts/docker/test-*.sh builds the image it needs and runs it,
      # including a real install against MariaDB. A failure here stops the
      # release from being published.
      - name: Run the image tests
        run: |
          failed=0
          for test in scripts/docker/test-*.sh; do
            echo "::group::$test"
            "$test" || { echo "::error::$test failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      # The tests leave the full and slim images in the local Docker daemon,
      # built from the same Dockerfile and arguments as the published ones.
      - name: Scan the full image for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mukurtu-test:full
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: docker/.trivyignore

      - name: Scan the slim image for fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mukurtu-test:slim
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: docker/.trivyignore

  publish:
    name: Publish (${{ matrix.variant }})
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # Each variant states its tool choice explicitly; the Dockerfile has no
        # defaults for these.
        include:
          - variant: full
            with_ffmpeg: "true"
            with_poppler: "true"
          - variant: slim
            with_ffmpeg: "false"
            with_poppler: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Work out the tags and the pinned template version
        id: meta
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VARIANT: ${{ matrix.variant }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/mukurtu"
          # The moving tags (4.0, 4, latest) only advance: the script publishes
          # one only if this release is the newest of its scope among the tags
          # that already exist, so a backport cannot pull `latest` backwards.
          tag_list="$(gh api --paginate "repos/$REPO/tags" --jq '.[].name')"
          {
            echo "image=$image"
            echo "revision=$(git rev-parse HEAD)"
            echo "template=$(tr -d '[:space:]' < docker/TEMPLATE_VERSION)"
            echo "tags<<TAGS"
            printf '%s\n' "$tag_list" | scripts/docker/compute-tags.sh --existing - "$TAG" "$VARIANT" | sed "s|^|$image:|"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for the arm64 build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            WITH_FFMPEG=${{ matrix.with_ffmpeg }}
            WITH_POPPLER=${{ matrix.with_poppler }}
            MUKURTU_TEMPLATE_VERSION=${{ steps.meta.outputs.template }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Mukurtu CMS
            org.opencontainers.image.description=Mukurtu CMS (${{ matrix.variant }} variant)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The template ships no lock file, so this records exactly which Drupal and
      # contributed-module versions the image contains.
      - name: Extract the resolved composer.lock
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker create --name lock "$IMAGE@$DIGEST" >/dev/null
          docker cp lock:/var/www/html/composer.lock composer.lock
          docker rm lock >/dev/null

      - name: Keep composer.lock with the run
        uses: actions/upload-artifact@v7
        with:
          name: composer-lock-${{ matrix.variant }}
          path: composer.lock
