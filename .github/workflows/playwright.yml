name: "Tugboat Playwright Tests"

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  wait-for-tugboat:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      statuses: read
    outputs:
      preview_url: ${{ steps.wait-for-preview.outputs.preview_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Wait for Tugboat Preview
        id: wait-for-preview
        run: |
          # Poll the "Tugboat" commit status and, once it reports success,
          # look for the PR comment containing the live preview URL (the
          # status's target_url only points at the Tugboat dashboard, not
          # the preview host itself). This fails fast on a real build error
          # instead of always waiting out the full timeout. The status has
          # been observed to flip success -> pending -> success while a
          # rebuild is still in progress, so an early "success" reading is
          # not trusted as final until the preview URL comment actually
          # shows up; if it hasn't yet, we just keep polling within the
          # same overall budget rather than failing outright.
          MAX_WAIT=2400
          INTERVAL=30
          ELAPSED=0
          PREVIEW_URL=""
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            TUGBOAT_STATE=$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/status" --jq '[.statuses[] | select(.context=="Tugboat")][0].state // "pending"' 2>/dev/null || echo "pending")

            if [[ "$TUGBOAT_STATE" == "failure" || "$TUGBOAT_STATE" == "error" ]]; then
              echo "Tugboat build failed (status: $TUGBOAT_STATE). See the Tugboat commit status check for details."
              exit 1
            fi

            if [[ "$TUGBOAT_STATE" == "success" ]]; then
              # --paginate is required: without it this call silently only
              # sees the first 30 PR comments, so the URL is invisible on
              # any PR whose conversation has grown past that.
              PREVIEW_URL=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate | jq -r '.[].body' | grep -Po 'https://(?!www\.|dashboard\.)[a-zA-Z0-9.-]+\.tugboatqa.com' | tail -n 1 || true)
              if [[ ! -z "$PREVIEW_URL" ]]; then
                echo "Preview URL found: $PREVIEW_URL"
                break
              fi
              echo "Tugboat status is success but no preview URL comment yet, still waiting..."
            else
              echo "Tugboat status: $TUGBOAT_STATE, waiting..."
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [[ -z "$PREVIEW_URL" ]]; then
            echo "Tugboat preview did not become available within the timeout."
            exit 1
          fi

          # The comment can appear before the preview site has finished
          # booting. A bare status-code check isn't enough here: Tugboat
          # serves its own "Preview is resuming" holding page (while a
          # suspended/idle preview container wakes back up) with a 200,
          # so that alone looks "ready" while Drupal underneath is still
          # down. Poll /user/login instead and only accept a response that
          # is actually the rendered Drupal login form.
          READY_MAX_WAIT=600
          READY_INTERVAL=15
          READY_ELAPSED=0
          while [ $READY_ELAPSED -lt $READY_MAX_WAIT ]; do
            RESULT=$(curl -s -L -o /tmp/tugboat-preview-check.html -w "%{http_code} %{url_effective}" "$PREVIEW_URL/user/login" || true)
            STATUS="${RESULT%% *}"
            EFFECTIVE_URL="${RESULT#* }"

            if [[ "$STATUS" == "200" ]] \
              && [[ "$EFFECTIVE_URL" != *"/core/install.php"* ]] \
              && ! grep -q "Preview is resuming" /tmp/tugboat-preview-check.html \
              && grep -qi ">Username<" /tmp/tugboat-preview-check.html; then
              echo "Preview is ready: $PREVIEW_URL"
              echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for Tugboat preview to serve the real Drupal site (status: $STATUS, url: $EFFECTIVE_URL)..."
            sleep $READY_INTERVAL
            READY_ELAPSED=$((READY_ELAPSED + READY_INTERVAL))
          done

          echo "Tugboat preview did not become ready in time."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  playwright-tests:
    needs: wait-for-tugboat
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: tests/playwright
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: tests/playwright
        run: npx playwright install chromium --with-deps

      - name: Run Playwright Tests
        working-directory: tests/playwright
        run: npx playwright test
        # Note this needs process.env.PLAYWRIGHT_BASE_URL to be evaluated in
        # as the baseURL in playwright.config.ts.
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.wait-for-tugboat.outputs.preview_url }}

  playwright-tests-main:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: tests/playwright
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: tests/playwright
        run: npx playwright install chromium --with-deps

      # Confirm the base preview is actually serving Drupal before handing the
      # URL to Playwright. Without this the job runs the full suite against
      # whatever the URL happens to return, and every test fails on a missing
      # login field, which reads as an application bug rather than as missing
      # infrastructure. That is not hypothetical: this job failed on all 100 of
      # its most recent runs because TUGBOAT_MAIN_URL pointed at a preview that
      # had been deleted, and the symptom was 6 login timeouts a few minutes in.
      #
      # The pull request path already does this, in wait-for-tugboat, for the
      # same reason. This is the same readiness check applied to the push path.
      - name: Check the base preview is serving Drupal
        env:
          TUGBOAT_MAIN_URL: ${{ vars.TUGBOAT_MAIN_URL }}
        run: |
          if [ -z "${TUGBOAT_MAIN_URL:-}" ]; then
            echo "::error::The TUGBOAT_MAIN_URL repository variable is not set, so there is no base preview to test against. Set it to the main branch base preview URL in Settings > Secrets and variables > Actions."
            exit 1
          fi

          BASE_URL="${TUGBOAT_MAIN_URL%/}"
          MAX_WAIT=600
          INTERVAL=15
          ELAPSED=0

          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            RESULT=$(curl -s -L -o /tmp/tugboat-main-check.html -w "%{http_code} %{url_effective}" "$BASE_URL/user/login" || true)
            STATUS="${RESULT%% *}"
            EFFECTIVE_URL="${RESULT#* }"

            # A deleted or renamed preview will never become ready, so say so
            # immediately rather than burning the full timeout on it. Tugboat
            # serves its own branded 404 for this, which is why the body is
            # checked and not just the status code.
            if grep -qi "Preview Not Found" /tmp/tugboat-main-check.html; then
              echo "::error::TUGBOAT_MAIN_URL ($BASE_URL) returns a Tugboat 'Preview Not Found' page. The base preview has been deleted or its hostname has changed. Update the TUGBOAT_MAIN_URL repository variable to the current main base preview URL."
              exit 1
            fi

            if [ "$STATUS" = "200" ] \
              && [[ "$EFFECTIVE_URL" != *"/core/install.php"* ]] \
              && ! grep -q "Preview is resuming" /tmp/tugboat-main-check.html \
              && grep -qi ">Username<" /tmp/tugboat-main-check.html; then
              echo "Base preview is ready: $BASE_URL"
              exit 0
            fi

            echo "Waiting for the base preview to serve the real Drupal site (status: $STATUS, url: $EFFECTIVE_URL)..."
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "::error::The base preview at $BASE_URL did not serve the Drupal login form within ${MAX_WAIT}s (last status: $STATUS). It may still be building, suspended, or misconfigured."
          exit 1

      - name: Run Playwright Tests
        working-directory: tests/playwright
        run: npx playwright test
        # TUGBOAT_MAIN_URL is a GitHub Actions variable set to the stable
        # Tugboat base preview URL for the main branch.
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.TUGBOAT_MAIN_URL }}
